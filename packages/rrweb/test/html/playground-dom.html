<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>playground-dom.html</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        color: #182636;
        font: 14px system-ui, sans-serif;
      }
      button {
        padding: 9px;
        border: 1px solid #aebac7;
        border-radius: 5px;
        font: inherit;
        background: white;
        color: inherit;
        cursor: pointer;
      }
      #squares {
        display: flex;
        flex-flow: row nowrap;
        gap: 2px;
        margin-top: 20px;
        overflow-x: auto;
      }
      .square {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
      }
      .green {
        background: green;
      }
      :focus-visible {
        outline: 3px solid #80b4fa;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <button id="add-squares" type="button">Add 5 squares</button>
    <button id="remove-squares" type="button">Remove 5 squares</button>
    <div id="squares" aria-label="Added squares"></div>
    <script>
      document
        .getElementById('remove-squares')
        .addEventListener('click', () => {
          const squares = document.getElementById('squares');
          for (let index = 0; index < 5; index++) {
            squares.lastElementChild?.remove();
          }
        });
      document
        .getElementById('add-squares')
        .addEventListener('click', async () => {
          for (let index = 0; index < 5; index++) {
            if (index > 0)
              await new Promise((resolve) => setTimeout(resolve, 200));
            const square = document.createElement('div');
            square.className = 'square green';
            document.getElementById('squares').append(square);
          }
        });
    </script>
  </body>
</html>
